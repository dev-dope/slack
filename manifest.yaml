display_information:
  name: mock-ezra
  description: Talk to this agent in a DM, or mention it in a channel.
  background_color: "#1D1C1D"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: mock-ezra
    always_online: true
  agent_view:
    agent_description: Talk to this agent in a DM, or mention it in a channel.
    suggested_prompts:
      - title: What can you do?
        message: What can you help me with?
      - title: Summarize this
        message: Summarize what I'm looking at.
oauth_config:
  scopes:
    bot:
      - assistant:write
      - app_mentions:read
      - chat:write
      - chat:write.public
      - im:history
      - im:read
      - im:write
      - channels:history
      - channels:read
      - channels:join
      - groups:history
      - groups:read
      - mpim:history
      - mpim:read
      - users:read
      - usergroups:read
      - emoji:read
      - files:read
      - files:write
      - reactions:read
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
      - app_context_changed
      - message.im
      - app_mention
      - agent_session_stopped
      - reaction_added
      - reaction_removed
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
